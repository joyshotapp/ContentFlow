<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 — ContentFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/static/css/admin.css">
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.6s ease-out; }
  </style>
</head>
<body class="h-full bg-slate-900 flex items-center justify-center">
  <div class="fade-in w-full max-w-sm px-6">
    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-indigo-500 flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/25">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-white">ContentFlow</h1>
      <p class="text-sm text-slate-400 mt-1">SEO 文章自動化後台</p>
    </div>

    <!-- Form -->
    <form method="post" action="/admin/login" class="bg-slate-800/50 backdrop-blur rounded-2xl border border-white/5 p-6 shadow-2xl">
      {% if error %}
      <div class="mb-4 px-4 py-2.5 bg-rose-500/10 border border-rose-500/20 rounded-lg">
        <p class="text-sm text-rose-400">{{ error }}</p>
      </div>
      {% endif %}

      <label class="block mb-1.5 text-sm font-medium text-slate-300">管理密碼</label>
      <input
        type="password"
        name="password"
        placeholder="輸入 API Secret Key"
        autofocus
        required
        class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-xl text-white placeholder-slate-500 text-sm
               focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50
               transition-all duration-200"
      >

      <button
        type="submit"
        class="mt-5 w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-medium text-sm rounded-xl
               shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40
               transition-all duration-200 active:scale-[0.98]"
      >
        進入後台
      </button>

      <p class="mt-4 text-center text-xs text-slate-500">
        使用 .env 中的 API_SECRET_KEY 登入
      </p>
    </form>
  </div>
</body>
</html>
