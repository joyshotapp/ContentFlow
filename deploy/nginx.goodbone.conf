# GoodBone 實例 nginx 設定快照
# 若要手動部署現行 GoodBone 網站，可直接參考此檔；新站點請改用 deploy/nginx.conf 模板渲染。

server {
    listen 80;
    listen [::]:80;
    server_name goodbone.com.tw www.goodbone.com.tw;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://goodbone.com.tw$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goodbone.com.tw;

    ssl_certificate     /etc/letsencrypt/live/goodbone.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodbone.com.tw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://goodbone.com.tw$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goodbone.com.tw;

    ssl_certificate     /etc/letsencrypt/live/goodbone.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodbone.com.tw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/goodbone.access.log;
    error_log  /var/log/nginx/goodbone.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_pragma;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|feed)$ {
        proxy_pass         http://127.0.0.1:8000/$1;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        allow 127.0.0.1;
        deny  all;
    }
}