# goodbone.com.tw — nginx 反向代理設定
# 放置路徑：/etc/nginx/sites-available/goodbone.com.tw
# 啟用：sudo ln -s /etc/nginx/sites-available/goodbone.com.tw /etc/nginx/sites-enabled/
#
# 初次部署時 certbot --nginx 會自動填入 ssl_certificate 路徑；
# 在 SSL 申請成功前，只有 HTTP 區塊生效。

# HTTP（初次部署 / Let's Encrypt ACME）
server {
    listen 80;
    listen [::]:80;
    server_name goodbone.com.tw www.goodbone.com.tw;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 申請到 SSL 後 certbot 會改寫這條為 301 → https
    location / {
        proxy_pass         http://127.0.0.1:8000/site/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|feed)$ {
        proxy_pass         http://127.0.0.1:8000/site/$1;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

