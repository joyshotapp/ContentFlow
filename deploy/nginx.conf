# ContentFlow site — nginx 反向代理模板
# 由 deploy/setup_remote.sh 以 DOMAIN 參數渲染後寫入 /etc/nginx/sites-available/<domain>
#
# 初次部署時 certbot --nginx 會自動填入 ssl_certificate 路徑；
# 在 SSL 申請成功前，只有 HTTP 區塊生效。

# HTTP（初次部署 / Let's Encrypt ACME）
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

