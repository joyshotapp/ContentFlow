# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goodbone.com.tw;

    ssl_certificate     /etc/letsencrypt/live/goodbone.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodbone.com.tw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://goodbone.com.tw$request_uri;
}

# 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goodbone.com.tw;

    ssl_certificate     /etc/letsencrypt/live/goodbone.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodbone.com.tw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Logs
    access_log /var/log/nginx/goodbone.access.log;
    error_log  /var/log/nginx/goodbone.error.log;

    # 代理至 ContentFlow API 的 /site 子應用
    # goodbone.com.tw/blog → localhost:8000/site/blog
    location / {
        proxy_pass         http://127.0.0.1:8000/site/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 讓 browser 快取靜態內容（Tailwind CDN 本身已處理，此為 HTML 快取控制）
        proxy_cache_bypass $http_pragma;
    }

    # sitemap / robots / feed — 直接透傳，不加 trailing slash
    location ~ ^/(sitemap\.xml|robots\.txt|feed)$ {
        proxy_pass         http://127.0.0.1:8000/site/$1;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 健康檢查（不對外）
    location /health {
        proxy_pass         http://127.0.0.1:8000/site/health;
        proxy_http_version 1.1;
        allow 127.0.0.1;
        deny  all;
    }
}
