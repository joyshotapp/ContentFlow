version: "3.9"

# goodbone.com.tw 生產環境
# 只部署 公開網站 (site sub-app) + PostgreSQL
# ContentFlow AI 後台（Streamlit、Agents）維持在本機運行
#
# 使用方式：docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 僅本機可連，ContentFlow 遠端寫入用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  site:
    build:
      context: .
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped
    # 只跑 site sub-app，4 workers，綁定 127.0.0.1 讓 nginx 代理
    command: >
      uvicorn contentflow.site.app:site_app
        --host 127.0.0.1
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips=*
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg2://contentflow:${DB_PASSWORD}@localhost:5432/contentflow
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    volumes:
      - ./data:/app/data

volumes:
  pgdata:

