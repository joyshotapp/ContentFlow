# goodbone.com.tw 生產環境
# 部署 FastAPI site_app（含 public site、admin、scheduler）+ PostgreSQL
#
# 使用方式：docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 僅本機可連，ContentFlow 遠端寫入用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  site:
    build:
      context: .
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped
    # 只跑 site sub-app，4 workers，綁定 127.0.0.1 讓 nginx 代理
    command: >
      uvicorn contentflow.site.app:site_app
        --host 127.0.0.1
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips=*
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg2://contentflow:${DB_PASSWORD}@localhost:5432/contentflow
      CHROMA_PERSIST_DIR: /app/data/chroma
      SCHEDULER_ENABLED: "false"
      SCHEDULER_REQUIRED: "true"
      SCHEDULER_HEARTBEAT_PATH: /app/data/scheduler_heartbeat.json
      SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS: "180"
      CONTENTFLOW_BUILD_COMMIT: ${CONTENTFLOW_BUILD_COMMIT:-unknown}
      CONTENTFLOW_BUILD_TIME: ${CONTENTFLOW_BUILD_TIME:-unknown}
      CONTENTFLOW_BUILD_SOURCE: ${CONTENTFLOW_BUILD_SOURCE:-unknown}
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health'); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
      - ./src:/app/src  # live-reload Python source — restart only (no rebuild) after code changes

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped
    command: python -m contentflow.scheduler_runner
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg2://contentflow:${DB_PASSWORD}@localhost:5432/contentflow
      CHROMA_PERSIST_DIR: /app/data/chroma
      SCHEDULER_ENABLED: "true"
      SCHEDULER_REQUIRED: "false"
      SCHEDULER_HEARTBEAT_PATH: /app/data/scheduler_heartbeat.json
      SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS: "180"
      CONTENTFLOW_BUILD_COMMIT: ${CONTENTFLOW_BUILD_COMMIT:-unknown}
      CONTENTFLOW_BUILD_TIME: ${CONTENTFLOW_BUILD_TIME:-unknown}
      CONTENTFLOW_BUILD_SOURCE: ${CONTENTFLOW_BUILD_SOURCE:-unknown}
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys; from pathlib import Path; from datetime import datetime,timezone; p=Path('/app/data/scheduler_heartbeat.json'); data=json.loads(p.read_text(encoding='utf-8')); ts=datetime.fromisoformat(data['timestamp']); age=(datetime.now(timezone.utc)-ts).total_seconds(); sys.exit(0 if age <= 180 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
      - ./src:/app/src

volumes:
  pgdata:

