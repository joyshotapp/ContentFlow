[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contentflow"
version = "0.1.0"
description = "SEO 文章自動化 AI Agent 系統"
requires-python = ">=3.11"
dependencies = [
    # Agent 框架
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",

    # LLM
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-genai>=1.0.0",

    # 物件儲存（Cloudflare R2 via S3 API）
    "boto3>=1.35.0",

    # HTTP / API 工具
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "requests>=2.32.0",

    # API 層
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # 排程
    "apscheduler>=3.10.0",

    # 資料儲存
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",

    # 向量資料庫（RAG / 學習層 Phase 3）
    "chromadb>=0.5.0",

    # Markdown 轉換
    "markdown>=3.7",

    # 環境設定
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # 資料處理
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Google Sheets
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-analytics-data>=0.18.0",

    # 日誌與通知
    "loguru>=0.7.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
observability = [
    "agentops==0.4.21",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
contentflow = "contentflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace\\('google'\\)`:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace\\('pyannote'\\)`:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
