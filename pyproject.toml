[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "contentflow"
version = "0.1.0"
description = "SEO 文章自動化 AI Agent 系統"
requires-python = ">=3.11"
dependencies = [
    # Agent 框架
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",

    # LLM
    "openai>=1.50.0",
    "anthropic>=0.34.0",

    # HTTP / API 工具
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "requests>=2.32.0",

    # 資料儲存
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",

    # 環境設定
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # 資料處理
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pandas>=2.2.0",

    # Google Sheets
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",

    # 審核介面
    "streamlit>=1.38.0",

    # 日誌與通知
    "loguru>=0.7.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
contentflow = "contentflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
